name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.10']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pip install pyinstaller
        pyinstaller --name=MusikPlayer --windowed --onefile --add-data="src;src" --hidden-import=customtkinter --hidden-import=pygame --hidden-import=mutagen --clean src/main.py
    
    - name: Build with PyInstaller (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        pip install pyinstaller
        pyinstaller --name=MusikPlayer --windowed --onefile --add-data="src:src" --hidden-import=customtkinter --hidden-import=pygame --hidden-import=mutagen --clean src/main.py
    
    - name: Build with PyInstaller (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pip install pyinstaller
        pyinstaller --name=musikplayer --windowed --onefile --add-data="src:src" --hidden-import=customtkinter --hidden-import=pygame --hidden-import=mutagen --clean src/main.py
    
    - name: Upload artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v3
      with:
        name: MusikPlayer-Windows
        path: dist/MusikPlayer.exe
    
    - name: Upload artifact (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v3
      with:
        name: MusikPlayer-macOS
        path: dist/MusikPlayer
    
    - name: Upload artifact (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v3
      with:
        name: MusikPlayer-Linux
        path: dist/musikplayer
  
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v3
      with:
        path: artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/MusikPlayer-Windows/MusikPlayer.exe
          artifacts/MusikPlayer-macOS/MusikPlayer
          artifacts/MusikPlayer-Linux/musikplayer
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.10']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pip install pyinstaller
        pyinstaller --name=MusikPlayer --windowed --onedir --add-data="src;src" --hidden-import=src.ui.main_window --hidden-import=src.ui.styles --hidden-import=src.ui.player_controls --hidden-import=src.ui.playlist_view --hidden-import=src.audio.player --hidden-import=src.audio.playlist_manager --hidden-import=src.utils.config_manager --hidden-import=src.utils.file_handler --hidden-import=src.utils.metadata_extractor --hidden-import=src.config --hidden-import=customtkinter --hidden-import=pygame --hidden-import=mutagen --collect-all customtkinter --collect-all pygame --hidden-import=tkinter --hidden-import=tkinter.filedialog --hidden-import=tkinter.messagebox --noconfirm --clean src/main.py
    
    - name: Create NSIS Installer (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install nsis -y
        & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
    
    - name: Build with PyInstaller (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        pip install pyinstaller
        pyinstaller --name=MusikPlayer --windowed --onedir --add-data="src:src" --hidden-import=src.ui.main_window --hidden-import=src.ui.styles --hidden-import=src.ui.player_controls --hidden-import=src.ui.playlist_view --hidden-import=src.audio.player --hidden-import=src.audio.playlist_manager --hidden-import=src.utils.config_manager --hidden-import=src.utils.file_handler --hidden-import=src.utils.metadata_extractor --hidden-import=src.config --hidden-import=customtkinter --hidden-import=pygame --hidden-import=mutagen --collect-all customtkinter --collect-all pygame --hidden-import=tkinter --hidden-import=tkinter.filedialog --hidden-import=tkinter.messagebox --noconfirm --clean src/main.py
    
    - name: Build with PyInstaller (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pip install pyinstaller
        pyinstaller --name=musikplayer --windowed --onedir --add-data="src:src" --hidden-import=src.ui.main_window --hidden-import=src.ui.styles --hidden-import=src.ui.player_controls --hidden-import=src.ui.playlist_view --hidden-import=src.audio.player --hidden-import=src.audio.playlist_manager --hidden-import=src.utils.config_manager --hidden-import=src.utils.file_handler --hidden-import=src.utils.metadata_extractor --hidden-import=src.config --hidden-import=customtkinter --hidden-import=pygame --hidden-import=mutagen --collect-all customtkinter --collect-all pygame --hidden-import=tkinter --hidden-import=tkinter.filedialog --hidden-import=tkinter.messagebox --noconfirm --clean src/main.py
    
    - name: Upload artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: MusikPlayer-Windows
        path: MusikPlayer-Setup.exe
    
    - name: Upload artifact (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: MusikPlayer-macOS
        path: dist/MusikPlayer/MusikPlayer
    
    - name: Upload artifact (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: MusikPlayer-Linux
        path: dist/musikplayer/musikplayer
  
  release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}-${{ github.sha }}
        name: Release v${{ github.run_number }}
        files: |
          artifacts/MusikPlayer-Windows/MusikPlayer-Setup.exe
          artifacts/MusikPlayer-macOS/MusikPlayer
          artifacts/MusikPlayer-Linux/musikplayer
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

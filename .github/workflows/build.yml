name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

# Un push nuevo a la misma referencia cancela la compilacion anterior: nada de
# valor se pierde y el runner queda libre para el commit que si importa.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificacion
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore Hidra.slnx

      - name: Compilar
        run: dotnet build Hidra.slnx -c Release --no-restore

      # El arnes cubre la matematica del analisis espectral, la memoria, la cola sin bloqueo,
      # la conversion de formatos y la cadena completa de decodificacion y conversion. No toca
      # el hardware: las dos sondas que si lo tocan son manuales a proposito, porque abren el
      # dispositivo de audio del equipo y emiten sonido.
      - name: Verificar
        run: dotnet run --project tests/Hidra.Verify -c Release --no-build

  publish:
    name: Publicacion estandar
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Despliegue ESTANDAR, no autocontenido: un ejecutable anfitrion mas las bibliotecas
      # administradas del proyecto, apoyado en el runtime de .NET y de Windows App SDK ya
      # instalados en el equipo. No hace falta el conjunto de herramientas de C++ de Visual
      # Studio, que era el unico paso del proceso que exigia Visual Studio.
      - name: Publicar
        run: >
          dotnet publish src/Hidra.Shell/Hidra.Shell.csproj
          -c Release
          -o artifacts/publish

      # La comprobacion no es cosmetica. El publicador de una aplicacion sin empaquetar omite
      # el marcado compilado y el indice de recursos, y el ejecutable resultante no arranca
      # sin decir por que. Se comprueba aqui porque en el equipo de desarrollo el sintoma se
      # confunde con un problema del entorno. La lista vive en scripts/Test-PublishLayout.ps1,
      # compartida con el workflow de release para que ambas no se desincronicen.
      - name: Comprobar que la publicacion esta completa
        shell: pwsh
        run: scripts/Test-PublishLayout.ps1 -PublishDir artifacts/publish

      - uses: actions/upload-artifact@v4
        with:
          name: hidra-win-x64
          path: artifacts/publish/
          if-no-files-found: error

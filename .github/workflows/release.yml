name: release

# Release continuo con instalador para Windows.
# Se dispara por:
# 1. Finalizacion exitosa del workflow build en la rama main.
# 2. Creacion de tags de version (v*).
# 3. Ejecucion manual desde la interfaz de GitHub Actions (workflow_dispatch),
#    opcionalmente indicando la version (X.Y.Z o X.Y.Z-prerelease).
#
# Notas de diseno:
# - El checkout SIEMPRE apunta al commit exacto del que provienen los binarios
#   (head_sha del build en eventos workflow_run), de modo que hidra.iss y el
#   artefacto descargado correspondan al mismo arbol de fuentes.
# - La creacion de releases se SERIALIZA con concurrency: dos disparos casi
#   simultaneos (un push de tag y un build que termina) no compiten por el
#   mismo release; el segundo espera y publica despues.
# - El instalador se sube ademas como artefacto del workflow: aunque la
#   publicacion del release falle, el binario queda recuperable.
on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de release (ej: 1.0.0 o v1.0.0; vacio = compilacion de desarrollo)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

# Sin cancel-in-progress: los disparos en cola se publican en orden, nunca se
# abandona un release a mitad de publicacion.
concurrency:
  group: release

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: Release con instalador
    runs-on: windows-2022
    timeout-minutes: 25

    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      # ---------------------------------------------------------------------
      #  Version y commit de origen
      # ---------------------------------------------------------------------
      # Los contextos de GitHub se pasan por entorno, nunca interpolados en el
      # guion: un valor con comillas o caracteres especiales no puede inyectar
      # comandos en el shell.
      - name: Identificar version y commit de origen
        id: meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $sha = if ($env:EVENT_NAME -eq 'workflow_run' -and $env:HEAD_SHA) {
            $env:HEAD_SHA
          } else {
            $env:GITHUB_SHA
          }
          $shortSha = $sha.Substring(0, [Math]::Min(7, $sha.Length))

          $tag = ''
          $version = ''

          if ($env:EVENT_NAME -eq 'push' -and $env:REF_TYPE -eq 'tag') {
            $tag = $env:REF_NAME
            $version = $tag -replace '^v', ''
          }
          elseif ($env:EVENT_NAME -eq 'workflow_dispatch' -and -not [string]::IsNullOrWhiteSpace($env:DISPATCH_VERSION)) {
            $version = $env:DISPATCH_VERSION.Trim() -replace '^v', ''
            if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "Version invalida '$version'. Formato esperado: X.Y.Z o X.Y.Z-sufijo (ej: 1.0.0, 1.0.0-beta.1)."
            }
            $tag = "v$version"
          }
          else {
            $tag = "v0.0.0-$shortSha"
            $version = "dev-$shortSha"
          }

          # Prerelease cuando el versionado lleva sufijo (semver) o es una
          # compilacion de desarrollo sin etiqueta.
          $isPrerelease = $version -match '-'

          "SHA=$sha" >> $env:GITHUB_ENV
          "SHORT_SHA=$shortSha" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "IS_PRERELEASE=$(if ($isPrerelease) { 'true' } else { 'false' })" >> $env:GITHUB_ENV

          Write-Host "Evento       : $($env:EVENT_NAME)"
          Write-Host "Commit SHA   : $sha ($shortSha)"
          Write-Host "Release Tag  : $tag"
          Write-Host "App Version  : $version"
          Write-Host "Prerelease   : $isPrerelease"

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          # El release nunca empuja nada: sin credenciales persistentes en git.
          persist-credentials: false

      - name: Descargar artefacto verificado si existe
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hidra-win-x64
          path: artifacts/publish
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # ---------------------------------------------------------------------
      #  Publicacion de los binarios
      # ---------------------------------------------------------------------
      # El artefacto descargado del build tiene prioridad; solo si falta algo
      # se recompila aqui. La lista de archivos imprescindibles y el resumen de
      # tamano viven en scripts/Test-PublishLayout.ps1, compartida con build.yml.
      - name: Asegurar publicacion de binarios del producto
        shell: pwsh
        run: |
          $publishComplete = $true
          try {
            & scripts/Test-PublishLayout.ps1 -PublishDir 'artifacts/publish' -ErrorAction Stop
          }
          catch {
            $publishComplete = $false
            Write-Host "Artefacto incompleto: $($_.Exception.Message)"
          }

          if (-not $publishComplete) {
            Write-Host 'Compilando y publicando Hidra.Shell en este runner...'
            dotnet publish src/Hidra.Shell/Hidra.Shell.csproj -c Release -o artifacts/publish
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet publish fallo con codigo de salida $LASTEXITCODE"
            }
            & scripts/Test-PublishLayout.ps1 -PublishDir 'artifacts/publish'
          }

      # ---------------------------------------------------------------------
      #  Certificado y firma Authenticode (tolerante si faltan secrets)
      # ---------------------------------------------------------------------
      - name: Configurar certificado para firma (si esta configurado)
        id: cert
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            Write-Host "::warning::Los secrets PFX_BASE64 / PFX_PASSWORD no estan configurados. El instalador se generara sin firma Authenticode."
            "SIGNING_ENABLED=false" >> $env:GITHUB_ENV
            return
          }

          try {
            $pfxPath = Join-Path $env:RUNNER_TEMP "hidra-codesign.pfx"
            $base64 = $env:PFX_BASE64 -replace '\s', ''
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($base64))

            $checkFlag = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            $check = New-Object Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $env:PFX_PASSWORD, $checkFlag)

            $importFlag = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::DefaultKeySet
            $signing = New-Object Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $env:PFX_PASSWORD, $importFlag)
            $store = New-Object Security.Cryptography.X509Certificates.X509Store([Security.Cryptography.X509Certificates.StoreName]::My, [Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
            $store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
            $store.Add($signing)
            $store.Close()

            # Destruccion segura del archivo PFX temporal
            $bytes = [IO.File]::ReadAllBytes($pfxPath)
            for ($i = 0; $i -lt $bytes.Length; $i++) { $bytes[$i] = 0 }
            [IO.File]::WriteAllBytes($pfxPath, $bytes)
            Remove-Item $pfxPath -Force

            "SIGNING_ENABLED=true" >> $env:GITHUB_ENV
            "CERT_SUBJECT=$($signing.Subject)" >> $env:GITHUB_ENV
            Write-Host "Certificado '$($signing.Subject)' importado al almacen del runner."
          }
          catch {
            Write-Warning "No se pudo procesar el certificado PFX: $($_.Exception.Message). Se continuara sin firma."
            "SIGNING_ENABLED=false" >> $env:GITHUB_ENV
          }

      - name: Localizar signtool
        if: ${{ env.SIGNING_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) {
            Write-Warning "signtool.exe no encontrado en Windows Kits. Se continuara sin firma."
            "SIGNING_ENABLED=false" >> $env:GITHUB_ENV
          } else {
            "SIGNTOOL=$signtool" >> $env:GITHUB_ENV
            Write-Host "signtool: $signtool"
          }

      # Todos los binarios se firman en UNA invocacion de signtool (acepta una
      # lista de archivos): mismo resultado y mucho mas rapido que un proceso
      # por DLL. Si el sellado de tiempo primario falla, se reintenta el lote
      # completo contra el servidor alterno.
      - name: Firmar binarios del producto
        if: ${{ env.SIGNING_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $targets = Get-ChildItem 'artifacts/publish' -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll' } |
            Sort-Object FullName |
            Select-Object -ExpandProperty FullName

          if (-not $targets) {
            Write-Host "No se encontraron binarios ejecutables para firmar."
            return
          }

          Write-Host "Firmando $($targets.Count) binarios:"
          $targets | ForEach-Object { Write-Host "  - $(Split-Path $_ -Leaf)" }

          & $env:SIGNTOOL sign /n $env:CERT_SUBJECT /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 @targets
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Fallo con digicert; reintentando el lote con sectigo..."
            & $env:SIGNTOOL sign /n $env:CERT_SUBJECT /fd SHA256 /tr http://timestamp.sectigo.com /td SHA256 @targets
          }

          if ($LASTEXITCODE -ne 0) {
            throw "signtool no pudo firmar los binarios (codigo $LASTEXITCODE)."
          }

      # ---------------------------------------------------------------------
      #  Instalador Inno Setup
      # ---------------------------------------------------------------------
      - name: Preparar Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $iscc) {
            Write-Host "Inno Setup no detectado. Instalando mediante Chocolatey..."
            choco install innosetup -y --no-progress | Out-Null
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $iscc) {
            throw "ISCC.exe no pudo ser localizado tras la instalacion."
          }

          Write-Host "ISCC ubicado en: $iscc"
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Compilar el instalador con Inno Setup
        shell: pwsh
        run: |
          $iscc = $env:ISCC
          $version = $env:APP_VERSION

          # Preparar la carpeta installer/publish con los binarios
          New-Item -ItemType Directory -Path 'installer/publish' -Force | Out-Null
          Copy-Item 'artifacts/publish/*' 'installer/publish/' -Recurse -Force

          Write-Host "Compilando instalador Hidra version: $version"
          & $iscc `
            /DMyAppVersion="$version" `
            installer\hidra.iss 2>&1 | ForEach-Object { Write-Host "  $_" }

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup (ISCC) fallo con codigo de salida $LASTEXITCODE"
          }

          $installer = Get-ChildItem 'installer' -Recurse -Filter 'Hidra-*-setup-x64.exe' | Select-Object -First 1
          if (-not $installer) {
            throw "El instalador no fue generado en la carpeta installer."
          }

          Write-Host "Instalador generado exitosamente: $($installer.FullName)"

      - name: Firmar el instalador (si el certificado esta disponible)
        if: ${{ env.SIGNING_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'installer' -Recurse -Filter 'Hidra-*-setup-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw "No se encontro el instalador para firmar." }

          Write-Host "Firmando instalador: $($installer.Name)"
          & $env:SIGNTOOL sign `
            /n $env:CERT_SUBJECT `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            $installer.FullName 2>&1 | ForEach-Object { Write-Host "  $_" }

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Fallo con digicert; reintentando con sectigo..."
            & $env:SIGNTOOL sign `
              /n $env:CERT_SUBJECT `
              /fd SHA256 `
              /tr http://timestamp.sectigo.com `
              /td SHA256 `
              $installer.FullName 2>&1 | ForEach-Object { Write-Host "  $_" }
          }

          & $env:SIGNTOOL verify /pa /all /q $installer.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "La firma del instalador no supero la verificacion (codigo $LASTEXITCODE)."
          }
          Write-Host "Firma del instalador verificada exitosamente."

      - name: Preparar assets y generar checksum SHA256
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'installer' -Recurse -Filter 'Hidra-*-setup-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw "No se encontro el ejecutable del instalador." }

          # Copiar instalador al directorio raiz de trabajo
          $rootInstaller = Join-Path (Get-Location) $installer.Name
          Copy-Item $installer.FullName $rootInstaller -Force

          # Generar archivo de hash SHA256
          $hash = (Get-FileHash $rootInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Out-File -Encoding ascii "$rootInstaller.sha256"

          "INSTALLER_NAME=$($installer.Name)" >> $env:GITHUB_ENV
          "INSTALLER_HASH=$hash" >> $env:GITHUB_ENV
          Write-Host "Asset listo: $($installer.Name)"
          Write-Host "Checksum  : $hash"

      # El binario queda en el almacen de artefactos del workflow aunque la
      # publicacion del release falle mas adelante.
      - name: Subir el instalador como artefacto del workflow
        uses: actions/upload-artifact@v4
        with:
          name: hidra-installer-${{ env.RELEASE_TAG }}
          path: |
            ${{ env.INSTALLER_NAME }}
            ${{ env.INSTALLER_NAME }}.sha256
          if-no-files-found: error

      # ---------------------------------------------------------------------
      #  Publicacion en GitHub Releases
      # ---------------------------------------------------------------------
      - name: Redactar notas del release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $sha = $env:SHORT_SHA
          $version = $env:APP_VERSION
          $tag = $env:RELEASE_TAG
          $installerName = $env:INSTALLER_NAME
          $hash = $env:INSTALLER_HASH
          $signingText = if ($env:SIGNING_ENABLED -eq 'true') { "Firmado digitalmente con Authenticode (RFC 3161)" } else { "Compilacion oficial verificada" }

          $commitUrl = "$($env:SERVER_URL)/$($env:REPOSITORY)/commit/$($env:SHA)"
          $runUrl = "$($env:SERVER_URL)/$($env:REPOSITORY)/actions/runs/$($env:RUN_ID)"

          # Cambios desde el release anterior: comparacion en el servidor contra
          # el ultimo tag publicado. Es informativo; si falla, las notas salen sin la seccion.
          $changesBlock = ''
          try {
            $releases = gh release list --limit 50 --json tagName | ConvertFrom-Json
            $prevTag = $releases |
              Where-Object { $_.tagName -ne $tag } |
              Select-Object -First 1 -ExpandProperty tagName

            if ($prevTag) {
              $subjects = gh api "repos/$env:GITHUB_REPOSITORY/compare/$prevTag...$env:SHA" `
                --jq '.commits[].commit.message | split("\n")[0]' 2>$null
              if ($LASTEXITCODE -eq 0 -and $subjects) {
                # Dos etapas: Unique sobre todo el conjunto, First despues; en una
                # sola llamada el orden de aplicacion no esta garantizado.
                $unique = @($subjects | Where-Object { $_ } | Select-Object -Unique)
                $lines = @($unique | Select-Object -First 20 |
                  ForEach-Object { "- $_" }) -join "`n"
                if ($lines) {
                  $changesBlock = "`n### Cambios desde $prevTag`n$lines`n"
                }
              }
            }
          }
          catch {
            Write-Host "No se pudieron listar cambios previos: $($_.Exception.Message)"
          }

          # Plantilla de una sola pieza con tokens: evita mezclar interpolacion
          # de PowerShell con el markdown (los backticks de las vallas de codigo
          # son caracteres de escape del here-string doble y corrompen el texto).
          $template = @'
          ## Hidra {VERSION}

          Compilacion automatica basada en el commit [{SHA}]({COMMIT_URL}).

          ### Instalador Oficial
          - **Archivo**: `{ASSET}`
          - **Seguridad**: {SIGNING}
          - **Ejecucion de CI**: [Detalles del flujo]({RUN_URL})

          ### Verificacion de Integridad SHA256
          ```powershell
          Get-FileHash {ASSET} -Algorithm SHA256
          # {HASH}
          ```
          {CHANGES}
          ### Caracteristicas del Paquete
          - Motor WASAPI en Modo Exclusivo de baja latencia con reproduccion bit-perfect.
          - Despliegue optimizado para Windows 10 (1809+) y Windows 11 (x64).
          - Asociacion moderna en el Explorador (`OpenWithProgids`) para formatos sin perdida y comprimidos (FLAC, WAV, MP3, M4A, AAC, ALAC, OGG, OPUS, AIFF, etc.).
          - Deteccion de prerrequisitos del sistema (.NET 10 y Windows App SDK 1.7) y desinstalacion limpia.
          '@

          $notes = $template
            .Replace('{VERSION}', $version)
            .Replace('{SHA}', $sha)
            .Replace('{COMMIT_URL}', $commitUrl)
            .Replace('{ASSET}', $installerName)
            .Replace('{SIGNING}', $signingText)
            .Replace('{RUN_URL}', $runUrl)
            .Replace('{HASH}', $hash)
            .Replace('{CHANGES}', $changesBlock)

          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes | Set-Content -Path $notesPath -Encoding utf8
          Write-Host "Notas escritas en $notesPath"

      # El tag se crea con --target para que apunte AL COMMIT DEL ARTEFACTO, no
      # a la HEAD que el servidor elija por defecto en eventos sin tag propio.
      - name: Publicar Release en GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $title = "Hidra $env:APP_VERSION"
          $installerPath = Join-Path (Get-Location) $env:INSTALLER_NAME
          $hashPath = "$installerPath.sha256"
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $visibility = if ($env:IS_PRERELEASE -eq 'true') { '--prerelease' } else { '--latest' }

          Write-Host "Comprobando release $tag..."
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "El release $tag ya existe. Actualizando notas y reemplazando archivos..."
            gh release edit $tag --title $title --notes-file $notesPath $visibility
            if ($LASTEXITCODE -ne 0) { throw "gh release edit fallo (codigo $LASTEXITCODE)" }
            gh release upload $tag $installerPath $hashPath --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload fallo (codigo $LASTEXITCODE)" }
          } else {
            Write-Host "Creando nuevo release $tag sobre el commit $($env:SHA)..."
            gh release create $tag $installerPath $hashPath `
              --target $env:SHA `
              --title $title `
              --notes-file $notesPath `
              $visibility
            if ($LASTEXITCODE -ne 0) { throw "gh release create fallo (codigo $LASTEXITCODE)" }
          }
          Write-Host "Release $tag publicado con exito."

      # ---------------------------------------------------------------------
      #  Limpieza y resumen (siempre, aunque lo anterior falle)
      # ---------------------------------------------------------------------
      - name: Limpiar el certificado del almacen del runner
        if: always()
        shell: pwsh
        run: |
          if ($env:CERT_SUBJECT) {
            try {
              $store = New-Object Security.Cryptography.X509Certificates.X509Store([Security.Cryptography.X509Certificates.StoreName]::My, [Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
              $store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
              foreach ($candidate in @($store.Certificates)) {
                if ($candidate.Subject -eq $env:CERT_SUBJECT) {
                  $store.Remove($candidate)
                  Write-Host "Certificado eliminado del almacen."
                }
              }
              $store.Close()
            } catch {
              Write-Host "Aviso de limpieza de certificado: $($_.Exception.Message)"
            }
          }

          Get-ChildItem $env:RUNNER_TEMP -Filter '*.pfx' -ErrorAction SilentlyContinue | ForEach-Object {
            try {
              $bytes = [IO.File]::ReadAllBytes($_.FullName)
              for ($i = 0; $i -lt $bytes.Length; $i++) { $bytes[$i] = 0 }
              [IO.File]::WriteAllBytes($_.FullName, $bytes)
              Remove-Item $_.FullName -Force
            } catch {
              Remove-Item $_.FullName -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Resumen del release
        if: always()
        shell: pwsh
        run: |
          $summary = @"

          ## Resumen del release

          | Campo    | Valor |
          | -------- | ----- |
          | Tag      | {TAG} |
          | Version  | {VERSION} |
          | Commit   | {SHORT_SHA} |
          | Asset    | {ASSET} |
          | SHA256   | {HASH} |
          | Firma    | {SIGNING} |
          "@

          $signingText = if ($env:SIGNING_ENABLED -eq 'true') { 'Authenticode (RFC 3161)' } else { 'sin firma (secrets no configurados)' }
          $text = $summary
            .Replace('{TAG}', $env:RELEASE_TAG)
            .Replace('{VERSION}', $env:APP_VERSION)
            .Replace('{SHORT_SHA}', $env:SHORT_SHA)
            .Replace('{ASSET}', $env:INSTALLER_NAME)
            .Replace('{HASH}', $env:INSTALLER_HASH)
            .Replace('{SIGNING}', $signingText)

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $text

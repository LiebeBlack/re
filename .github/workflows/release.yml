name: release

# Release continuo con instalador firmado. Se dispara UNICAMENTE cuando la
# ejecucion del workflow `build` ha terminado con exito sobre main, de modo que
# lo que se publica parte del artefacto que ya paso la verificacion completa
# (arnes y chequeo de publicacion): no se recompila el producto, se firma, se
# empaqueta en instalador y se convierte en Release.
#
# Las ejecuciones de pull_request del workflow build no generan Release: el
# filtro de rama de workflow_run (branches: [main]) lo excluye, de modo que
# solo los push integrados al repositorio publican version.
on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

# contents: write permite crear el Release con el GITHUB_TOKEN del repositorio.
# actions: read es OBLIGATORIO para descargar un artefacto de OTRA ejecucion
# (download-artifact con run-id distinto del actual), que es exactamente este caso.
permissions:
  contents: write
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Release con instalador firmado
    runs-on: windows-2022
    timeout-minutes: 25

    # Con workflow_run el trabajo solo arranca si el workflow origen concluyo
    # SUCCESS; la condicion explicita documenta la intencion.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Identificar la ejecucion de build que origina el release
        shell: pwsh
        run: |
          "SHA=${{ github.event.workflow_run.head_sha }}" >> $env:GITHUB_ENV
          "SHORT_SHA=$("${{ github.event.workflow_run.head_sha }}".Substring(0, 7))" >> $env:GITHUB_ENV

      - uses: actions/checkout@v4
        # Checkout SOLO para el script del instalador (installer/hidra.iss) y las
        # notas: el producto no se recompila, viene del artefacto de CI.

      # ==========================================================================
      #  CERTIFICADO: PFX_BASE64 y PFX_PASSWORD en SECRETS del repositorio.
      #
      #  El PFX viaja codificado en Base64 porque los secrets no admiten binario.
      #  El certificado tiene una CADENA de 4 entidades (raiz, dos intermedias y
      #  hoja de firma de codigo). LA CADENA DEBE VENIR DENTRO DEL PFX: signtool
      #  firma con la hoja y /tr sella con fecha, pero Windows reconstruye la
      #  cadena leyendo las entidades del propio mensaje PKCS#12. Si el PFX solo
      #  contuviera la hoja, la validacion fallaria en equipos sin las
      #  intermedias en cache, y esa clase de fallo se confunde con un driver.
      #
      #  La clave privada se importa al ALMACEN DEL USUARIO del runner en lugar
      #  de dejar que signtool abra el fichero con /p: la contrasena en la linea
      #  de comandos queda visible en el registro de procesos de la maquina, y el
      #  fichero PFX en disco es material comprometible mientras exista. Importar
      #  al almacen y destruir el fichero elimina las dos superficies a la vez.
      # ==========================================================================
      - name: Restaurar el certificado desde SECRETS
        id: cert
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            throw "El secret PFX_BASE64 no esta configurado en el repositorio."
          }

          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            throw "El secret PFX_PASSWORD no esta configurado en el repositorio."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "hidra-codesign.pfx"

          # FromBase64String tolera la notacion multilinea de un PFX pegado con
          # saltos: los espacios y saltos se eliminan antes de decodificar.
          $base64 = $env:PFX_BASE64 -replace '\s', ''
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($base64))

          # Verificacion temprana: si la contrasena es incorrecta o el PFX no
          # parsea, el fallo sale AQUI con un mensaje claro y no a mitad del bucle
          # de firma. EphemeralKeySet: esta primera instancia es solo de comprobacion.
          $checkFlag = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $check = New-Object Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $env:PFX_PASSWORD, $checkFlag)

          # La cadena completa debe resolverse desde el PFX: hoja + intermedias +
          # raiz. Un PFX con solo la hoja firma igualmente, pero Windows no
          # reconstruye la cadena en los equipos del usuario y los binarios
          # aparecen como de editor desconocido.
          $chain = New-Object Security.Cryptography.X509Certificates.X509Chain
          $chain.ChainPolicy.RevocationMode = [Security.Cryptography.X509Certificates.X509RevocationMode]::NoCheck
          $null = $chain.Build($check)
          $elements = $chain.ChainElements.Count
          Write-Host "Entidades de la cadena resueltas desde el PFX: $elements"

          if ($elements -lt 4) {
            throw "El PFX no trae la cadena completa (se esperaban 4 entidades, se resolvieron $elements). Exporta el PFX con la cadena incluida."
          }

          # Importar la hoja CON SU CLAVE PRIVADA al almacen del usuario actual.
          # Es lo que signtool consumira con /n: la contrasena no viaja en ninguna
          # linea de comandos y el fichero PFX puede destruirse inmediatamente.
          $importFlag = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::DefaultKeySet
          $signing = New-Object Security.Cryptography.X509Certificates.X509Certificate2($pfxPath, $env:PFX_PASSWORD, $importFlag)
          $store = New-Object Security.Cryptography.X509Certificates.X509Store([Security.Cryptography.X509Certificates.StoreName]::My, [Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
          $store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          $store.Add($signing)
          $store.Close()

          "CERT_SUBJECT=$($signing.Subject)" >> $env:GITHUB_ENV

          # Destruir el fichero PFX YA: la clave ya esta en el almacen del usuario
          # y el fichero en RUNNER_TEMP es material comprometible desde este
          # momento. Cero-fill byte a byte antes del borrado: el borrado simple
          # deja el contenido en el sector hasta que el sistema lo reutilice.
          $bytes = [IO.File]::ReadAllBytes($pfxPath)
          for ($i = 0; $i -lt $bytes.Length; $i++) { $bytes[$i] = 0 }
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          Remove-Item $pfxPath -Force

          Write-Host "Certificado '$($signing.Subject)' importado al almacen del usuario; PFX destruido."
        env:
          PFX_BASE64: ${{ secrets.PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}

      - name: Descargar el artefacto verificado
        # El artefacto 'hidra-win-x64' lo subio el job publish de ESA ejecucion:
        # es el binario EXACTO que acabo de pasar CI, no una reconstruccion.
        uses: actions/download-artifact@v4
        with:
          name: hidra-win-x64
          path: artifacts/publish
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comprobar que el artefacto esta completo
        shell: pwsh
        run: |
          $required = @(
            'Hidra.Shell.exe',
            'Hidra.Shell.dll',
            'Hidra.Kernel.dll',
            'Hidra.Audio.dll',
            'Hidra.Interop.dll',
            'Hidra.Shell.pri',
            'App.xbf',
            'MainWindow.xbf',
            'EngineSettingsPage.xbf',
            'DiagnosticsPage.xbf',
            'AboutPage.xbf',
            'Hidra.Shell.deps.json',
            'Hidra.Shell.runtimeconfig.json'
          )

          $missing = $required | Where-Object { -not (Test-Path "artifacts/publish/$_") }
          if ($missing) { throw "Faltan archivos en el artefacto descargado: $($missing -join ', ')" }

          Write-Host ("Artefacto verificado: {0} archivos" -f (Get-ChildItem artifacts/publish -File).Count)

      # ==========================================================================
      #  FIRMA AUTHENTICODE EN BUCLE: cada binario ejecutable del artefacto se
      #  firma por separado.
      #
      #  Que se firma: .exe (imágenes ejecutables) y .dll (bibliotecas, incluidas
      #  las administradas: Windows valida la firma de Hidra.Kernel.dll igual que
      #  la de un DLL nativo). NO se firman .xbf/.pri/.json: no son ejecutables y
      #  signtool los rechaza; su integridad queda cubierta por el instalador
      #  firmado que los contiene.
      #
      #  /fd SHA256: digest moderno. /tr + /td SHA256: sellado de tiempo RFC 3161,
      #  que mantiene la firma valida DESPUES de que el certificado expire, que es
      #  la unica forma de que un binario descargado hoy siga verificando en 2030.
      # ==========================================================================
      - name: Localizar signtool y los certificados de la cadena
        id: signtool
        shell: pwsh
        run: |
          # signtool.exe viene con Windows 10 SDK, preinstalado en windows-2022.
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) { throw "signtool.exe no encontrado en Windows Kits." }

          "SIGNTOOL=$signtool" >> $env:GITHUB_ENV
          Write-Host "signtool: $signtool"

      - name: Firmar cada binario del artefacto
        id: sign
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $signtool = $env:SIGNTOOL
          $subject = $env:CERT_SUBJECT

          # El bucle firma TODOS los ejecutables y bibliotecas, incluidas las
          # dependencias externas (Microsoft.Windows.SDK.NET.dll, WinRT.Runtime.dll
          # y compania que publica el SDK): un ejecutable firmado que referencia
          # DLL sin firmar levanta avisos de SmartScreen igualmente.
          $targets = Get-ChildItem 'artifacts/publish' -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll' } |
            Sort-Object FullName

          if (-not $targets) { throw "No hay binarios .exe/.dll que firmar en el artefacto." }

          Write-Host "Binarios a firmar: $($targets.Count)"
          $failures = @()

          foreach ($binary in $targets) {
            Write-Host "  $($binary.Name)"

            # /n referencia el certificado por su asunto en el ALMACEN del usuario:
            # la contrasena del PFX nunca aparece en una linea de comandos. /fd
            # SHA256 y /tr + /td SHA256 sellan el digest moderno con fecha RFC 3161.
            & $signtool sign `
              /n $subject `
              /fd SHA256 `
              /tr http://timestamp.digicert.com `
              /td SHA256 `
              $binary.FullName 2>&1 | ForEach-Object { Write-Host "    $_" }

            if ($LASTEXITCODE -ne 0) {
              $failures += $binary.Name
              Write-Warning "FALLO al firmar $($binary.Name) (exit $LASTEXITCODE)"
            }
          }

          if ($failures.Count -gt 0) {
            throw "No se pudieron firmar: $($failures -join ', ')"
          }

          # Verificacion post-firma: cada binario debe llevar firma valida con
          # timestamp y cadena completa. Un binario sin firma verificable no sale
          # del release: es el punto de todo el proceso.
          foreach ($binary in $targets) {
            & $signtool verify /pa /all /q $binary.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "La firma de $($binary.Name) no verifica: binario rechazado."
            }
          }

          Write-Host "Firma verificada en $($targets.Count) binarios."

      # ==========================================================================
      #  INSTALADOR: Inno Setup 6 compila el script con la version del release y
      #  el ejecutable desinstalador que produce tambien se firma (es un .exe que
      #  el usuario ejecuta, con el mismo derecho a SmartScreen limpio).
      # ==========================================================================
      - name: Compilar el instalador con Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $iscc) {
            # El runner de GitHub no trae Inno Setup: se instala a la vista del
            # proceso con la herramienta oficial de Chocolatey, que es reproducible.
            choco install innosetup -y --no-progress | Out-Null
            $iscc = Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }

          # La version del instalador es el SHA corto: no hay version de paquete,
          # y el SHA dice exactamente que codigo contiene. El script espera los
          # binarios en publish\ relativo al .iss (Source: "publish\*"), de modo
          # que el artefacto descargado se copia ahi antes de compilar.
          New-Item -ItemType Directory -Path 'installer/publish' -Force | Out-Null
          Copy-Item 'artifacts/publish/*' 'installer/publish/' -Recurse -Force

          & $iscc.FullName `
            /DMyAppVersion="dev-$($env:SHORT_SHA)" `
            installer\hidra.iss 2>&1 | ForEach-Object { Write-Host "  $_" }

          if ($LASTEXITCODE -ne 0) { throw "ISCC fallo con exit $LASTEXITCODE" }

      - name: Firmar el instalador
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = $env:SIGNTOOL
          $installer = Get-ChildItem 'installer' -Filter '*.exe' | Select-Object -First 1

          if (-not $installer) { throw "El instalador no se genero." }

          # Misma via que los binarios: certificado del almacen por asunto, sin
          # contrasenas en lineas de comandos.
          & $signtool sign `
            /n $env:CERT_SUBJECT `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            $installer.FullName 2>&1 | ForEach-Object { Write-Host "  $_" }

          if ($LASTEXITCODE -ne 0) { throw "Fallo al firmar el instalador." }

          & $signtool verify /pa /all /q $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "La firma del instalador no verifica." }

          # Copia al raiz para que el release no dependa de la ruta del instalador.
          Copy-Item $installer.FullName ".\$($installer.Name)"

          $hash = (Get-FileHash $installer.Name -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Out-File -Encoding ascii "$($installer.Name).sha256"

          Write-Host "Instalador firmado: $($installer.Name) (SHA256 $hash)"

      # ==========================================================================
      #  DESTRUCCION DEL CERTIFICADO. if: always() hace que corra aunque la firma
      #  o el empaquetado hayan fallado: el PFX en disco de un runner es material
      #  comprometible y el fallo de un paso no lo justifica.
      #
      #  Se destruye de forma segura: cero-fill (sobrescritura de cada byte) y
      #  delete. El borrado simple deja el contenido en el disco hasta que el
      #  sector se reutiliza; el cero-fill garantiza que nada recupere la clave
      #  privada del disco del runner.
      # ==========================================================================
      - name: Limpiar el certificado del almacen del runner
        if: always()
        shell: pwsh
        run: |
          # La clave privada se elimina del almacen del usuario del runner: el PFX
          # ya fue destruido en el paso de importacion (cero-fill + delete), y esto
          # cierra el ciclo. if: always() hace que corra aunque la firma o el
          # empaquetado hayan fallado: un certificado vivo en un runner tras un
          # fallo es material comprometible igualmente.
          if ($env:CERT_SUBJECT) {
            $store = New-Object Security.Cryptography.X509Certificates.X509Store([Security.Cryptography.X509Certificates.StoreName]::My, [Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
            $store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)

            foreach ($candidate in @($store.Certificates)) {
              if ($candidate.Subject -eq $env:CERT_SUBJECT) {
                $store.Remove($candidate)
                Write-Host "Certificado eliminado del almacen."
              }
            }

            $store.Close()
          }

          # Purga residual: cualquier .pfx que haya quedado en el area temporal
          # del runner por la razon que sea se destruye con cero-fill.
          Get-ChildItem $env:RUNNER_TEMP -Filter '*.pfx' -ErrorAction SilentlyContinue | ForEach-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            for ($i = 0; $i -lt $bytes.Length; $i++) { $bytes[$i] = 0 }
            [IO.File]::WriteAllBytes($_.FullName, $bytes)
            Remove-Item $_.FullName -Force
            Write-Host "PFX residual destruido: $($_.Name)"
          }

      # ==========================================================================
      #  PUBLICACION. Al Release van SOLO los artefactos firmados: instalador y
      #  checksum. El zip plano de binarios ya no se publica: el instalador es
      #  el vehiculo de distribucion y el zip sin firmar degradaria la confianza
      #  que la firma aporta.
      # ==========================================================================
      - name: Redactar las notas del release
        shell: pwsh
        run: |
          $sha = $env:SHORT_SHA
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"
          $commitUrl = "${{ github.server_url }}/${{ github.repository }}/commit/${{ env.SHA }}"

          $notes = @'
Compilacion automatica del commit [{SHA}]({COMMIT_URL}).

**Instalador**: `Hidra-dev-{SHA}-setup-x64.exe` (firmado con Authenticode, sellado con fecha RFC 3161)

- Ejecucion de verificacion: [{RUN_ID}]({RUN_URL}) (arnes completo, 0 fallos)
- Instalador con tema oscuro: asociacion de extensiones de audio (ABRIR CON / doble clic), deteccion de runtimes y desinstalacion limpia
- Requisitos: Windows 10 1809 o superior; el instalador detecta .NET y Windows App SDK y ofrece instalarlos si faltan
- Un commit, un release: re-ejecutar CI actualiza el release del mismo commit en lugar de duplicarlo

Verificacion de integridad del paquete (PowerShell):

```powershell
Get-FileHash Hidra-dev-{SHA}-setup-x64.exe -Algorithm SHA256
```

Toda la cadena de binarios (ejecutable, bibliotecas e instalador) esta firmada con Authenticode: Windows valida la firma en cada archivo y el instalador no dispara SmartScreen en equipos con la raiz de la entidad certificadora instalada.
'@

          $notes = $notes.Replace('{SHA}', $sha).Replace('{COMMIT_URL}', $commitUrl).Replace('{RUN_ID}', "${{ github.event.workflow_run.id }}").Replace('{RUN_URL}', $runUrl)

          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Crear o actualizar el release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = $env:SHORT_SHA
          $tag = "v0.0.0-$sha"
          $installer = Get-ChildItem -File -Filter 'Hidra-*-setup-x64.exe' | Select-Object -First 1

          if (-not $installer) { throw "No hay instalador firmado que publicar." }

          $assets = @($installer.Name, "$($installer.Name).sha256")

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "El release $tag ya existia: se actualizan notas y assets"
            gh release edit $tag --title "Hidra dev-$sha" --notes-file release-notes.md --latest
            gh release upload $tag @assets --clobber
          }
          else {
            Write-Host "Creando el release $tag"
            gh release create $tag @assets --title "Hidra dev-$sha" --notes-file release-notes.md --latest
          }
